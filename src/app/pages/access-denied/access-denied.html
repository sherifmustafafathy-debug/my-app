<main class="access-denied" [attr.dir]="locale.language() === 'ar' ? 'rtl' : 'ltr'"><section class="access-panel"><span class="access-mark">!</span><p class="eyebrow">{{ locale.text('permissions') }}</p><h1>{{ locale.text('accessDeniedTitle') }}</h1><p class="subheading">{{ locale.text('accessDeniedMessage') }}</p><button class="button button-quiet" type="button" (click)="signOut()">{{ locale.text('signOut') }}</button></section></main>
